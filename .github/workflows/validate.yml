name: Orqesta SwarmKit validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: orqesta-swarmkit-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_SWARMKIT_USE_CONTAINER: "1"

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - lint
          - generate-validate
          - vendor-validate
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Validate
        run: make "${{ matrix.target }}"
