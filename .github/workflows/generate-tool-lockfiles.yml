name: Generate Go tool lockfiles
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfiles:
    if: github.head_ref == 'refactor/go-modules-no-vendor'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOSUMDB: sum.golang.org
      GONOSUMDB: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve pinned Go tools
        run: |
          mkdir tools
          cd tools
          go mod init github.com/moby/swarmkit/tools
          go mod edit -go=1.25.0
          go get -tool github.com/go-delve/delve/cmd/dlv@v1.25.2 github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go mod tidy
          go mod verify
          go mod tidy -diff
          sed 's/^/TOOLMOD:/' go.mod
          sed 's/^/TOOLSUM:/' go.sum
