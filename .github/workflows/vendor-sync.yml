name: Regenerate vendored dependencies

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Synchronize Go modules and vendor tree
        shell: bash
        run: |
          set -euo pipefail
          make go-mod-vendor
          (cd swarmd && go mod tidy)
          git add -A -- go.mod go.sum swarmd/go.mod swarmd/go.sum vendor
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(events): synchronize vendored dependency graph'
            git push origin HEAD:master
          fi
