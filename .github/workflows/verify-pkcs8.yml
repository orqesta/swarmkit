name: Verify PKCS8 compatibility
on:
  pull_request:
permissions:
  contents: read
jobs:
  ca:
    if: github.head_ref == 'refactor/go-modules-no-vendor'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOSUMDB: sum.golang.org
      GONOSUMDB: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify CA and key compatibility
        run: go test -count=1 ./ca/...
