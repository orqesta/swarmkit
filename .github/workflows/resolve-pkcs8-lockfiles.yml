name: Verify dependency migration
on:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'refactor/go-modules-no-vendor'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOSUMDB: sum.golang.org
      GONOSUMDB: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Audit remaining dependency references
        run: |
          git ls-files -- ':(glob)**/vendor/**'
          git grep -n -i -E 'hard fork|forked from|copied from|adapted from|vendored|vendor/|go:generate|go (get|install|run).*(@latest|-u)|GOSUMDB.?off|GONOSUMDB=.*\*|protobuild|docker-sync|gopath' -- ':!*.sum' ':!*.pb.go' ':!api/api.pb.txt' ':!.github/workflows/resolve-pkcs8-lockfiles.yml' || test "$?" -eq 1
          if git grep -n 'github.com/moby/swarmkit/v2/ca/pkcs8' -- '*.go'; then
            exit 1
          fi
          gofmt -l ca/keyutils/keyutils.go ca/keyutils/pkcs8_test.go ca/keyreadwriter.go ca/keyreadwriter_test.go ca/certificates.go ca/testutils/cautils.go
      - name: Verify native modules
        run: make module-validate
      - name: Validate cryptographic key compatibility
        run: |
          go test -count=1 ./ca/keyutils
          go test -count=1 ./ca/...
